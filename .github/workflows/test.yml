name: Test
on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: 3.15
      - name: Install uv
        uses: astral-sh/setup-uv@v7
        with:
          version: "0.13.x"
      - name: Install dependencies
        run: uv sync --locked
      - name: Install prek
        uses: j178/prek-action@v3.1.0
        with:
          prek-version: "0.5.x"
          install-only: true
      - name: Run prek
        run: prek run --show-diff-on-failure --color=always --all-files
      - name: Run tests
        run: uv run --locked pytest -v
